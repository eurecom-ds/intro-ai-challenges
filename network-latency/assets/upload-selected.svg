    <text x="22" y="30" font-size="11" font-weight="700" fill="#93c5fd" letter-spacing="1.1">UPLOAD 2 OF 2</text>
    <text x="22" y="65" font-size="22" font-weight="700" fill="#f1f5f9">Upload the selected model</text>
    <text x="22" y="94" font-size="16" font-weight="400" fill="#f1f5f9">Choose a configuration from the list above, then upload using the names, address and access</text>
